services:
  postgres:
    image: postgres:17-alpine
    container_name: minhasaude-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minhasaude
      POSTGRES_PASSWORD: minhasaude
      POSTGRES_DB: minhasaude
    ports:
      - "5432:5432"
    volumes:
      - minhasaude_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minhasaude -d minhasaude"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minhasaude_postgres_data:
