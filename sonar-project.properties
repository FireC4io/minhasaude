# SonarQube Cloud (análise a cada push; workflow .github/workflows/sonar.yml).
# Chaves no formato que o SonarQube Cloud cria ao importar o repositório do GitHub.
sonar.projectKey=FireC4io_minhasaude
sonar.organization=firec4io
sonar.projectName=Gota Vital

sonar.sources=apps/api/src,apps/mobile/src,packages/shared/src,scripts
sonar.tests=apps/api/src,apps/api/test,apps/mobile/src,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.e2e-spec.ts,apps/api/test/**
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/api/generated/**,**/node_modules/**,**/dist/**,**/coverage/**

# Fora da cobertura: código gerado, migrations (a SeedTacoFoods é dado, não lógica)
# e a montagem de módulos do Nest, que só liga peças.
sonar.coverage.exclusions=**/migrations/**,**/seeds/**,**/*.module.ts,**/main.ts,**/app/**/_layout.tsx,scripts/**
# A migration da TACO é uma tabela enorme de dados, e os três arquivos de tradução
# têm a mesma estrutura de propósito: nenhum dos dois é código duplicado.
sonar.cpd.exclusions=**/migrations/**,**/i18n/locales/**

# Nos e2e da API a asserção é o `.expect(status)` do supertest, que a regra S2699
# ("teste sem asserção") não reconhece: 46 falsos bloqueadores.
sonar.issue.ignore.multicriteria=e2eAssert,devPath
sonar.issue.ignore.multicriteria.e2eAssert.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e2eAssert.resourceKey=apps/api/test/**

# Os scripts de scripts/ rodam só na máquina de quem desenvolve (hook de commit,
# geradores) e chamam git/npx pelo PATH de propósito. Trocar o PATH ali exige a
# máquina já comprometida; não vão para o app nem para a API.
sonar.issue.ignore.multicriteria.devPath.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.devPath.resourceKey=scripts/**

sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/api/coverage-e2e/lcov.info,apps/mobile/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.sourceEncoding=UTF-8

# O workflow falha (e o GitHub avisa por e-mail) quando o Quality Gate reprova.
sonar.qualitygate.wait=true
