packages:
  - "apps/*"
  - "packages/*"
# Expo/Metro e o ecossistema React Native assumem resolução "flat" de
# node_modules; o isolamento estrito padrão do pnpm quebra plugins do babel
# (ex.: babel-preset-expo) que dependem de hoisting. Ver docs.expo.dev/guides/monorepos.
nodeLinker: hoisted
overrides:
  multer: ">=2.3.0"
  js-yaml: ">=4.3.2 <5"
  path-to-regexp: ">=8.4.0"
  lodash: ">=4.18.0"
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@babel/plugin-transform-typescript@7.29.9'
  - '@expo/cli@57.0.26'
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo-router@57.0.22
  - expo@57.0.24
  - regjsparser@0.13.3
  - typedoc-plugin-markdown@4.13.1
