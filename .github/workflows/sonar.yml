name: SonarQube Cloud

# Qualidade e segurança do código (bugs, vulnerabilidades, pontos sensíveis de
# segurança, duplicação) com a cobertura dos testes unitários dos três pacotes.
# Configuração em sonar-project.properties. Sem o segredo SONAR_TOKEN, o job
# pula a análise em vez de falhar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: análise SonarQube Cloud
    runs-on: ubuntu-latest
    # Postgres efêmero para os e2e da API: a maior parte dela é testada por eles,
    # e sem essa cobertura o Quality Gate media só os testes unitários.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minhasaude
          POSTGRES_PASSWORD: minhasaude
          POSTGRES_DB: minhasaude
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minhasaude -d minhasaude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NODE_ENV: test
      DATABASE_URL: postgresql://minhasaude:minhasaude@localhost:5432/minhasaude
      # Segredo só para a vida do job, contra um Postgres efêmero - nunca usado em produção.
      JWT_ACCESS_SECRET: ci-test-only-secret-nunca-usado-em-producao-000000
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: o Sonar usa o blame para saber o que é código novo.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # A API e o app importam o dist/ do shared.
      - name: Buildar @minhasaude/shared
        run: pnpm --filter @minhasaude/shared build

      - name: Testes unitários com cobertura
        run: |
          pnpm --filter @minhasaude/shared test --coverage
          pnpm --filter @minhasaude/api test --coverage
          pnpm --filter @minhasaude/mobile test --coverage

      - name: Preparar banco dos e2e (migrations + catálogo TACO)
        run: |
          pnpm --filter @minhasaude/api migration:run
          pnpm --filter @minhasaude/api seed:taco

      - name: Testes e2e da API com cobertura
        run: pnpm --filter @minhasaude/api test:e2e --runInBand --coverage

      - name: Análise
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2

      - name: Aviso sem token
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN não configurado; análise do SonarQube Cloud pulada."
