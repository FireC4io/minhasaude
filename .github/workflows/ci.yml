name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissão mínima: o job só lê o repositório (OpenSSF Scorecard, Token-Permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, test, build (workspaces afetados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Necessário para o turbo comparar contra HEAD^1 / base do PR
          # (--filter=...[<ref>]) e rodar só nos workspaces afetados.
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # Sem "version": lê o campo "packageManager" do package.json raiz.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Determinar ref de comparação (workspaces afetados)
        id: turbo-filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^1" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, test e build (apenas workspaces afetados)
        run: pnpm exec turbo run lint test build --filter="...[${{ steps.turbo-filter.outputs.ref }}]"

      # Regras de arquitetura (.dependency-cruiser.cjs): sem ciclos, shared sem
      # depender de app, API e mobile sem import direto entre si. Roda sempre,
      # não só nos workspaces afetados — leva poucos segundos.
      # O turbo acima só builda os pacotes afetados: sem mudança no shared, o
      # dist/ dele não existe e o dependency-cruiser acusa import sem resolução.
      - name: Buildar @minhasaude/shared (para as regras de dependência)
        run: pnpm --filter @minhasaude/shared build

      - name: Regras de dependência entre módulos
        run: pnpm deps:check

  audit:
    name: pnpm audit (vulnerabilidades alta/crítica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditar dependências (quebra em high/critical)
        run: pnpm audit --audit-level=high

  e2e:
    name: e2e (@minhasaude/api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minhasaude
          POSTGRES_PASSWORD: minhasaude
          POSTGRES_DB: minhasaude
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minhasaude -d minhasaude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://minhasaude:minhasaude@localhost:5432/minhasaude
      # Segredo só para a vida do job de CI, contra um Postgres efêmero - nunca usado em produção.
      JWT_ACCESS_SECRET: ci-test-only-secret-nunca-usado-em-producao-000000
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Sem isto TODA suíte e2e falha com "Cannot find module '@minhasaude/shared'":
      # o pacote aponta `main`/`types` pra `dist/`, que não é versionado. O job de
      # lint/test/build não sofria porque o turbo já builda o shared via dependsOn,
      # e o pipeline local também não — por isso a quebra passou despercebida.
      - name: Buildar @minhasaude/shared (os e2e importam o dist/)
        run: pnpm --filter @minhasaude/shared build

      - name: Rodar migrations
        run: pnpm --filter @minhasaude/api migration:run

      # Os testes de busca (trigram/unaccent) verificam nomes reais da TACO
      # ("Arroz, integral, cozido", "Açúcar...") em vez de criar fixture, então
      # precisam do catálogo semeado. O banco do CI é efêmero e nasce vazio.
      - name: Semear catálogo TACO (exigido pelos e2e de busca)
        run: pnpm --filter @minhasaude/api seed:taco

      - name: Rodar testes e2e
        run: pnpm --filter @minhasaude/api test:e2e
