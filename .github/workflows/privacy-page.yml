name: Política de privacidade (GitHub Pages)

# Publica só a página da política, gerada de docs/legal/politica-de-privacidade.md.
# Fica no GitHub Pages e não no Render porque o plano gratuito do Render dorme:
# o revisor da Play acharia o link quebrado.
on:
  push:
    branches: [main]
    paths:
      - docs/legal/politica-de-privacidade.md
      - scripts/build-privacy-page.mjs
      - .github/workflows/privacy-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # Só o pacote raiz (markdown-it); o resto do monorepo não é necessário.
      - name: Instalar dependências da raiz
        run: pnpm install --frozen-lockfile --filter minha-saude

      - name: Gerar a página
        run: node scripts/build-privacy-page.mjs _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacidade/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
