name: Política de privacidade (GitHub Pages)

# Publica a política e a página de exclusão de conta, geradas de docs/legal/*.md.
# Fica no GitHub Pages e não no Render porque o plano gratuito do Render dorme:
# o revisor da Play acharia o link quebrado.
on:
  push:
    branches: [main]
    paths:
      - docs/legal/politica-de-privacidade.md
      - docs/legal/excluir-conta.md
      - scripts/build-privacy-page.mjs
      - .github/workflows/privacy-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Só o pacote raiz (markdown-it); o resto do monorepo não é necessário.
      - name: Instalar dependências da raiz
        run: pnpm install --frozen-lockfile --filter minha-saude

      - name: Gerar a página
        run: node scripts/build-privacy-page.mjs

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacidade/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
