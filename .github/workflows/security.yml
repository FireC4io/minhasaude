name: Segurança

# Análise de código (CodeQL) e busca de segredos (gitleaks) a cada push e uma
# vez por semana. O repositório é público e o app guarda dado de saúde: um
# segredo commitado ou uma injeção não podem depender de alguém lembrar de olhar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: gitleaks (histórico inteiro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar segredos
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Inclui as consultas de segurança extras, além do conjunto padrão.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
