name: OpenSSF Scorecard

# Nota de práticas de segurança do repositório (proteção de branch, actions
# fixadas por hash, permissões mínimas, revisão de dependências...). Os achados
# vão para a aba Security → Code scanning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: results.sarif
