# Busca de segredos (roda no CI a cada push, sobre o histórico inteiro).
# O repositório é público: qualquer chave que passe por um commit vaza.
[extend]
useDefault = true

[allowlist]
description = "Senhas falsas de teste, o valor de exemplo do .env.example e identificadores públicos"
paths = [
  '''^apps/api/test/.*\.e2e-spec\.ts$''',
  '''^apps/api/src/.*\.spec\.ts$''',
  '''(^|/)\.env\.example$''',
]
# Chave do projeto no SonarQube Cloud: identificador público, não segredo.
regexes = [
  '''FireC4io_minhasaude''',
  # Nome de campo público da API do Open Food Facts (off-product.schema.ts).
  '''energy-kcal_100g''',
]
